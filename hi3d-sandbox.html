<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>示例费用申请</title><style>
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:#f4f7f8;color:#203235;margin:0;padding:24px}main{max-width:720px;margin:auto;background:#fff;border:1px solid #dce5e6;border-radius:14px;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h2{font-size:20px;margin:0 0 8px}small{color:#68817d}label{display:block;margin:20px 0 7px}input,select{border:1px solid #cbd6d5;padding:10px;border-radius:6px;width:100%;font:inherit}button{background:#0c7563;color:white;border:0;padding:10px 16px;border-radius:6px;font:inherit;cursor:pointer;margin-top:18px}button.secondary{background:#eef5f3;color:#0c7563}#message{min-height:22px;color:#b83e32;margin-top:16px}#record{padding:12px;background:#f1f7f5;border-radius:6px;white-space:pre-wrap}nav{border-bottom:1px solid #e3ebea;padding-bottom:12px;margin-bottom:14px}.success{color:#167c59!important}[hidden]{display:none!important}
</style></head><body><main><header><div><h2>费用申请</h2><small>隔离示例业务 · 模拟角色</small></div><span id="actor-label">Alice / 申请人</span></header><nav><button class="secondary" id="my-requests">我的申请</button> <button id="approve-button" hidden>审批处理</button></nav><form id="request-form"><label for="title">申请标题</label><input id="title" autocomplete="off" placeholder="例如：测试设备采购"><label for="amount">申请金额（元）</label><input id="amount" type="number" value="200"><button id="create-button" type="submit">创建申请</button></form><div id="message" role="status"></div><pre id="record" hidden></pre></main><script type="module" src="hi3d-sandbox.mjs"></script></body></html>
